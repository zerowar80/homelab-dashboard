<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈랩 대시보드</title>
<style>
  :root{
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #20242c;
    --line: #2a2f3a;
    --text: #e7eaf0;
    --muted: #8b93a3;
    --proxmox: #e8823c;
    --proxmox-dim: #4a3324;
    --synology: #4f8ff0;
    --synology-dim: #253552;
    --ok: #5cc98a;
    --warn: #e0b84c;
    --bad: #e5636b;
    --radius: 8px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px;
  }
  header h1{ font-size:16px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  header .sub{ color:var(--muted); font-size:12px; margin-top:1px; }
  .controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .controls .updated{ font-size:11.5px; color:var(--muted); font-family:var(--mono); }
  .username-badge{ font-size:11.5px; color:var(--muted); }
  .live-indicator{ display:flex; align-items:center; gap:5px; font-size:11px; color:#4a4f5a; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:#4a4f5a; }
  .live-dot.on{ background:var(--ok); box-shadow:0 0 5px var(--ok); }
  button.refresh{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 12px; border-radius:var(--radius); cursor:pointer;
    font-size:12.5px; display:flex; align-items:center; gap:6px;
    transition:background .15s;
  }
  button.refresh:hover{ background:#262b34; }
  button.refresh:active{ transform:translateY(1px); }
  .server-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px;
    padding:16px; max-width:2200px; margin:0 auto;
    align-items:start;
  }
  @media (max-width:900px){ .server-grid{ grid-template-columns:1fr; } }

  .zone{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:auto; resize:vertical; min-height:140px;
  }
  .zone-head{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .zone-head .name{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.ok{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.bad{ background:var(--bad); box-shadow:0 0 8px var(--bad); }
  .dot.off{ background:#4a4f5a; }
  a.open-link{
    font-size:11.5px; color:var(--muted); text-decoration:none; border:1px solid var(--line);
    padding:4px 9px; border-radius:6px; transition:color .15s, border-color .15s;
  }
  a.open-link:hover{ color:var(--text); border-color:#3a4150; }

  .metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); }
  .metric{ background:var(--panel); padding:10px 12px; }
  .metric .label{ font-size:10.5px; color:var(--muted); margin-bottom:4px; }
  .metric .value{ font-family:var(--mono); font-size:17px; font-weight:600; }
  .metric .value.warn{ color:var(--warn); }
  .metric .value.bad{ color:var(--bad); }
  @media (max-width:480px){ .metrics{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){
    .controls .updated{ display:none; }
    header h1{ font-size:15px; }
    button.refresh{ padding:6px 10px; font-size:12px; }
  }

  .subhead{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 14px 4px; font-size:12px; font-weight:600; color:var(--muted);
  }
  .subhead .hint{ font-size:11px; font-weight:400; color:#5c6373; }

  .list{ padding:4px 8px 8px; }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border-radius:6px; cursor:pointer; user-select:none;
    transition:background .12s;
  }
  .row:hover{ background:var(--panel-2); }
  .row-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .row-left .name{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
  .badge{ font-size:10.5px; padding:2px 6px; border-radius:4px; font-family:var(--mono); flex-shrink:0; }
  .badge.qemu{ background:var(--proxmox-dim); color:var(--proxmox); }
  .badge.lxc{ background:#2c3a2c; color:#8bc98a; }
  .row-right{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--muted); flex-shrink:0; }
  .usage-badge{ font-size:11px; color:var(--muted); white-space:nowrap; }
  @media (max-width:480px){ .usage-badge{ display:none; } }

  .pill{
    font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .pill.on{ background:#1d3a2a; color:var(--ok); }
  .pill.off{ background:#33262a; color:#a8a2ab; }
  .pill.paused{ background:#3a331d; color:var(--warn); }
  .pill::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }

  .detail{
    display:none; padding:8px 14px 14px 30px; font-size:12.5px; color:var(--muted); font-family:var(--mono);
    line-height:1.7;
  }
  .row.expanded .detail{ display:block; }
  .row.expanded{ background:var(--panel-2); }

  .empty, .error-box{ padding:14px 18px; color:var(--muted); font-size:12.5px; line-height:1.6; }
  .error-box{ color:var(--bad); }
  code{ background:var(--panel-2); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:12px; }

  .storage-list{ padding:10px 18px 16px; display:flex; flex-direction:column; gap:12px; }
  .vol{ font-size:13px; }
  .vol-top{ display:flex; justify-content:space-between; margin-bottom:6px; color:var(--muted); font-family:var(--mono); font-size:12px; }
  .bar{ height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; }

  /* 접속자/차단 */
  .conn-row{ padding:8px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-radius:6px; }
  .conn-row:hover{ background:var(--panel-2); }
  .conn-left{ display:flex; align-items:center; gap:10px; font-size:12.5px; min-width:0; }
  .conn-left .ip{ font-family:var(--mono); }
  .conn-left .who{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .action-badge{ font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:4px; }
  .action-badge.DROP{ background:#3a1f22; color:var(--bad); }
  .action-badge.ACCEPT{ background:#1d3a2a; color:var(--ok); }
  .btn-block{
    background:none; border:1px solid #4a2d33; color:#e08b91; font-size:11px;
    padding:4px 10px; border-radius:6px; cursor:pointer; flex-shrink:0; transition:background .12s;
  }
  .btn-block:hover{ background:#2a1c1f; }
  .btn-unblock{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:11px;
    padding:4px 10px; border-radius:6px; cursor:pointer; flex-shrink:0; transition:background .12s;
  }
  .btn-unblock:hover{ background:var(--panel-2); color:var(--text); }

  .block-input-row{ display:flex; gap:8px; padding:0 18px 10px; }
  .block-input-row input{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:12.5px; font-family:var(--mono);
    outline:none;
  }
  .block-input-row input:focus{ border-color:#3a4150; }
  .block-input-row button{
    background:#2a1c1f; border:1px solid #4a2d33; color:#e08b91; padding:8px 14px;
    border-radius:6px; font-size:12.5px; cursor:pointer; flex-shrink:0; transition:background .12s;
  }
  .block-input-row button:hover{ background:#3a262b; }
  .blocked-list{ padding:0 8px 12px; }
  .blocked-item{
    display:flex; align-items:center; justify-content:space-between; padding:7px 10px;
    font-family:var(--mono); font-size:12px; border-radius:6px;
  }
  .blocked-item:hover{ background:var(--panel-2); }

  /* 설정 모달 */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:480px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .modal-head h2{ margin:0; font-size:16px; }
  .modal-close{ background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; }
  .modal-close:hover{ color:var(--text); }
  .modal-body{ padding:18px 20px; overflow-y:auto; }
  .modal-section{ margin-bottom:22px; }
  .modal-section:last-child{ margin-bottom:0; }
  .modal-section h3{
    display:flex; align-items:center; gap:8px; font-size:13.5px; margin:0 0 12px;
  }
  .modal-dot{ width:8px; height:8px; border-radius:50%; }
  .modal-body label{
    display:block; font-size:12px; color:var(--muted); margin:10px 0 5px;
  }
  .modal-body label .hint{ color:#5c6373; }
  .modal-body input, .modal-body select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius:6px; font-size:13px; font-family:var(--mono); outline:none;
  }
  .modal-body input:focus, .modal-body select:focus{ border-color:#3a4150; }
  .modal-msg{ font-size:12.5px; color:var(--ok); min-height:16px; }
  .modal-msg.error{ color:var(--bad); }
  .modal-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; }
  .modal-save{
    background:var(--synology); border:none; color:#0d1420; font-weight:600;
    padding:9px 20px; border-radius:6px; font-size:13px; cursor:pointer;
  }
  .modal-save:hover{ opacity:.9; }
  .notice-setup-btn{
    margin:0 18px 14px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 14px; border-radius:6px; font-size:12.5px; cursor:pointer;
  }
  .notice-setup-btn:hover{ background:#262b34; }

  /* 서비스 바로가기 */
  .shortcuts{ max-width:2200px; margin:0 auto; padding:0 16px 32px; }
  .shortcuts-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .shortcuts-head h2{ font-size:15px; margin:0; font-weight:600; }
  .add-group-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 14px; border-radius:6px; font-size:12.5px; cursor:pointer;
  }
  .add-group-btn:hover{ background:#262b34; }
  .group-card{ margin-bottom:16px; }
  .group-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .drag-handle{
    cursor:grab; color:#4a4f5a; font-size:14px; line-height:1; user-select:none; flex-shrink:0;
  }
  .drag-handle:hover{ color:var(--muted); }
  .drag-handle:active{ cursor:grabbing; }
  .group-head h3{ font-size:14px; margin:0; font-weight:600; color:var(--text); }
  .group-head .group-actions{ display:flex; gap:6px; margin-left:auto; }
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--muted); width:26px; height:26px;
    border-radius:6px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color:var(--text); border-color:#3a4150; }
  .guest-actions{ display:flex; gap:4px; margin-left:4px; }
  .guest-actions .icon-btn{ width:22px; height:22px; font-size:11px; }
  .guest-actions .icon-btn:hover{ color:var(--text); border-color:var(--synology); }
  .guest-actions .icon-btn[data-guest-action="shutdown"]:hover{ border-color:var(--bad); color:var(--bad); }
  .tile-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; }
  .tile{
    background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:10px;
    position:relative; transition:border-color .15s;
    overflow:auto; resize:vertical; min-height:66px;
  }
  .tile:hover{ border-color:#3a4150; }
  .tile-top{ display:flex; align-items:flex-start; gap:8px; }
  .tile-icon{
    width:28px; height:28px; border-radius:7px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:12px; color:#fff; overflow:hidden;
  }
  .tile-icon img{ width:100%; height:100%; object-fit:cover; }
  .tile-text{ min-width:0; flex:1; }
  .tile-text a{ color:var(--text); text-decoration:none; font-size:13px; font-weight:600; display:block;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-text .sub{ color:var(--muted); font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-status{ width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:5px; }
  .tile-status.up{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .tile-status.down{ background:var(--bad); }
  .tile-status.unknown{ background:#4a4f5a; }
  .tile-edit-btn{
    position:absolute; top:6px; right:6px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); width:20px; height:20px; border-radius:5px; font-size:10px; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .tile:hover .tile-edit-btn{ display:flex; }
  .tile-drag-handle{
    position:absolute; top:6px; left:6px; width:16px; height:16px; display:none;
    align-items:center; justify-content:center; color:#4a4f5a; font-size:11px;
    cursor:grab; user-select:none; background:var(--panel-2); border-radius:4px;
  }
  .tile:hover .tile-drag-handle{ display:flex; }
  .tile-drag-handle:active{ cursor:grabbing; }
  .tile-stats{ display:grid; grid-template-columns:repeat(2, 1fr); gap:5px; margin-top:8px; }
  .tile-stat{ background:var(--panel-2); border-radius:6px; padding:6px 7px; }
  .tile-stat .v{ font-family:var(--mono); font-size:12.5px; font-weight:600; }
  .tile-stat .l{ font-size:9px; color:var(--muted); margin-top:1px; letter-spacing:.02em; }
  .add-tile-card{
    border:1px dashed var(--line); border-radius:9px; display:flex; align-items:center;
    justify-content:center; color:var(--muted); font-size:12px; cursor:pointer; min-height:48px;
    background:none; width:100%;
  }
  .add-tile-card:hover{ border-color:#3a4150; color:var(--text); }
  .modal-danger{
    background:none; border:1px solid #4a2d33; color:#e08b91; font-size:12.5px;
    padding:8px 14px; border-radius:6px; cursor:pointer; margin-right:auto;
  }
  .modal-danger:hover{ background:#2a1c1f; }
  .modal-foot{ gap:8px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ margin:0; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .widget-fields{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .custom-field-row{ display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-top:6px; align-items:center; }

  /* 서버 관리 */
  .server-list-item{
    display:flex; align-items:center; justify-content:space-between; padding:9px 10px;
    border-radius:6px; font-size:13px; cursor:pointer;
  }
  .server-list-item:hover{ background:var(--panel-2); }
  .server-list-item .host{ color:var(--muted); font-family:var(--mono); font-size:11.5px; }

  /* 설정 모달 탭 */
  .settings-tabs{ display:flex; gap:4px; padding:10px 16px 0; border-bottom:1px solid var(--line); }
  .settings-tab{
    background:none; border:none; color:var(--muted); font-size:12.5px; padding:9px 12px;
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .settings-tab.active{ color:var(--text); border-bottom-color:var(--synology); }
  .settings-tab:hover{ color:var(--text); }
  .access-log-item{
    display:flex; align-items:center; justify-content:space-between; padding:7px 10px;
    font-size:12px; font-family:var(--mono); border-radius:6px;
  }
  .access-log-item:hover{ background:var(--panel-2); }
  .access-log-item .fail{ color:var(--bad); }
  .access-log-item .ok{ color:var(--ok); }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="pageTitle">홈랩 대시보드</h1>
    <div class="sub"><span id="pageSubtitle">Proxmox VE · Synology DSM</span> <span id="versionBadge" style="opacity:.6"></span></div>
  </div>
  <div class="controls">
    <span class="live-indicator" id="liveDotWrap"><span class="live-dot" id="liveDot"></span>실시간</span>
    <span class="updated" id="updated">불러오는 중…</span>
    <span class="username-badge" id="usernameBadge" style="display:none"></span>
    <button class="refresh" id="logoutBtn" style="display:none">로그아웃</button>
    <button class="refresh" id="settingsBtn">⚙ 설정</button>
    <button class="refresh" id="refreshBtn">↻ 새로고침</button>
  </div>
</header>

<main class="server-grid" id="serverGrid"></main>

<div class="shortcuts">
  <div class="shortcuts-head">
    <h2>서비스 바로가기</h2>
    <button class="add-group-btn" id="addGroupBtn">+ 그룹 추가</button>
  </div>
  <div id="groupsContainer"></div>
</div>

<!-- 그룹 추가/수정 모달 -->
<div class="modal-overlay" id="groupModalOverlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-head">
      <h2 id="groupModalTitle">그룹 추가</h2>
      <button class="modal-close" data-close="groupModalOverlay">✕</button>
    </div>
    <div class="modal-body">
      <label>그룹 이름</label>
      <input type="text" id="groupNameInput" placeholder="예: 핵심 관리">
      <div class="modal-msg" id="groupModalMsg"></div>
    </div>
    <div class="modal-foot">
      <button class="modal-danger" id="groupDeleteBtn" style="display:none">그룹 삭제</button>
      <button class="modal-save" id="groupSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 타일 추가/수정 모달 -->
<div class="modal-overlay" id="tileModalOverlay">
  <div class="modal" style="max-width:480px">
    <div class="modal-head">
      <h2 id="tileModalTitle">바로가기 추가</h2>
      <button class="modal-close" data-close="tileModalOverlay">✕</button>
    </div>
    <div class="modal-body">
      <label>이름</label>
      <input type="text" id="tileName" placeholder="예: Immich">
      <label>부제 <span class="hint">(선택)</span></label>
      <input type="text" id="tileSubtitle" placeholder="예: 사진 백업">
      <label>URL <span class="hint">(클릭하면 이동)</span></label>
      <input type="text" id="tileUrl" placeholder="https://...">
      <label>아이콘 이미지 URL <span class="hint">(비우면 이니셜로 표시)</span></label>
      <input type="text" id="tileIcon" placeholder="https://.../icon.png">
      <div class="checkbox-row">
        <input type="checkbox" id="tileStatusCheck" checked>
        <label for="tileStatusCheck">온라인 상태 확인 (URL로 접속해봄)</label>
      </div>

      <label style="margin-top:14px">통계 위젯</label>
      <select id="tileWidget">
        <option value="none">없음 (링크만)</option>
        <option value="portainer">Portainer (컨테이너 실행 현황)</option>
        <option value="custom_json">커스텀 JSON API</option>
      </select>

      <div class="widget-fields" id="portainerFields" style="display:none">
        <label>Portainer 주소</label>
        <input type="text" id="pfHost" placeholder="https://portainer:9443">
        <label>API Key</label>
        <input type="password" id="pfApiKey" placeholder="변경하려면 입력">
      </div>

<script>
const fmtBytes = (b) => {
  if (!b && b !== 0) return '-';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0, v = Number(b);
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(1) + units[i];
};
const fmtPct = (v) => (v * 100).toFixed(0) + '%';
const fmtUptime = (s) => {
  if (!s) return '-';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d > 0 ? `${d}일 ${h}시간` : `${h}시간`;
};
// Synology의 up_time은 DSM 버전에 따라 초(숫자) 또는 "D:H:M:S" 문자열로 옵니다.
const fmtSynUptime = (v) => {
  if (!v && v !== 0) return '-';
  if (typeof v === 'string' && v.includes(':')) {
    const parts = v.split(':').map(Number);
    if (parts.some(isNaN)) return v;
    const h = parts.length === 4 ? parts[1] : parts[0];
    const d = parts.length === 4 ? parts[0] : 0;
    return d > 0 ? `${d}일 ${h}시간` : `${h}시간`;
  }
  const n = Number(v);
  return isNaN(n) ? '-' : fmtUptime(n);
};
const levelClass = (pct) => pct > 0.85 ? 'bad' : pct > 0.65 ? 'warn' : '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- 카드/타일 크기 직접 조절 (드래그로 리사이즈, localStorage에 저장) ---------------- */

const resizeObserved = new WeakSet();

function resizeKeyFor(el) {
  if (el.dataset.pveId) return 'size:pve:' + el.dataset.pveId;
  if (el.dataset.synId) return 'size:syn:' + el.dataset.synId;
  if (el.dataset.vmId) return 'size:vm:' + el.dataset.vmId;
  if (el.dataset.tileId) return 'size:tile:' + el.dataset.tileId;
  return null;
}

function initResizable(el) {
  const key = resizeKeyFor(el);
  if (!key) return;
  // 가로 폭은 그리드가 알아서 맞추게 두고, 세로 높이만 기억합니다.
  // (가로까지 고정하면 그리드 칸 크기와 안 맞아서 옆에 빈 틈이 생길 수 있어요)
  el.style.width = '';
  try {
    const saved = JSON.parse(localStorage.getItem(key) || 'null');
    if (saved?.h) el.style.height = saved.h;
  } catch {}
  if (resizeObserved.has(el)) return;
  resizeObserved.add(el);
  const ro = new ResizeObserver(() => {
    localStorage.setItem(key, JSON.stringify({ h: el.style.height }));
  });
  ro.observe(el);
}

function initAllResizables() {
  document.querySelectorAll('[data-pve-id], [data-syn-id], [data-vm-id], [data-tile-id]').forEach(initResizable);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) {
    location.href = '/login.html';
    return new Promise(() => {}); // 리다이렉트되므로 이후 처리는 무시
  }
  return r.json();
}

function pillFor(status) {
  if (status === 'running') return `<span class="pill on">실행 중</span>`;
  if (status === 'paused') return `<span class="pill paused">일시정지</span>`;
  return `<span class="pill off">중지됨</span>`;
}
function dockerPillFor(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('run')) return `<span class="pill on">실행 중</span>`;
  if (s.includes('pause')) return `<span class="pill paused">일시정지</span>`;
  return `<span class="pill off">중지됨</span>`;
}

/* ==================== 서버 목록 (Proxmox / Synology, 여러 대) ==================== */

let pveServers = [];
let synServers = [];

async function loadServers() {
  const data = await api('/api/servers');
  pveServers = data.proxmox || [];
  synServers = data.synology || [];
  renderServerGrid();
  renderServerManagerLists();
}

let lastGridSignature = null;

function renderServerGrid() {
  const grid = document.getElementById('serverGrid');
  if (pveServers.length === 0 && synServers.length === 0) {
    grid.innerHTML = `<div class="zone"><div class="empty">등록된 서버가 없습니다.</div><button class="notice-setup-btn" data-open-settings>⚙ 지금 서버 등록하기</button></div>`;
    lastGridSignature = null;
    return;
  }
  // 서버 구성(개수/순서)이 안 바뀌었으면 카드 틀은 그대로 두고 내용만 새로 채웁니다.
  // (매번 통째로 다시 그리면 실시간 업데이트마다 화면이 깜빡여서 "새로고침 느낌"이 납니다)
  const signature = pveServers.map(s => 'p:' + s.id).join(',') + '|' + synServers.map(s => 's:' + s.id).join(',');
  if (signature !== lastGridSignature) {
    // Proxmox 모니터링 카드 바로 옆에 그 서버의 VM/컨테이너 카드를 붙여서 배치합니다.
    grid.innerHTML = pveServers.map(s => pveCardShell(s) + vmCardShell(s)).join('') + synServers.map(s => synCardShell(s)).join('');
    lastGridSignature = signature;
  }
  pveServers.forEach(loadPveZone);
  synServers.forEach(loadSynZone);
  initAllResizables();
}

/* ---------------- Proxmox 카드 ---------------- */

function pveCardShell(server) {
  return `
    <section class="zone" data-pve-id="${server.id}">
      <div class="zone-head">
        <div class="name">
          <span class="drag-handle" draggable="true" data-pve-drag="${server.id}" title="드래그해서 순서 바꾸기">⠿</span>
          <span class="dot off" data-role="dot"></span>${esc(server.name)}
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <a class="open-link" href="${esc(server.host)}" target="_blank" rel="noopener">웹 UI 열기 ↗</a>
          <button class="icon-btn" data-edit-server="pve:${server.id}" title="서버 설정">⚙</button>
        </div>
      </div>
      <div data-role="body"><div class="empty">불러오는 중…</div></div>
    </section>`;
}

function vmCardShell(server) {
  return `
    <section class="zone" data-vm-id="${server.id}">
      <div class="zone-head">
        <div class="name">
          <span class="drag-handle" draggable="true" data-pve-drag="${server.id}" title="드래그해서 순서 바꾸기">⠿</span>
          ${esc(server.name)} · 가상머신/컨테이너
        </div>
      </div>
      <div data-role="vmbody"><div class="empty">불러오는 중…</div></div>
    </section>`;
}

function pveMetricsHtml(nodes) {
  return `<div class="metrics">` + nodes.map((n) => {
    const cpuPct = n.cpu, memPct = n.mem / n.maxmem, diskPct = n.disk / n.maxdisk;
    return `
      <div class="metric"><div class="label">${esc(n.node)} · CPU</div><div class="value ${levelClass(cpuPct)}">${fmtPct(cpuPct)}</div></div>
      <div class="metric"><div class="label">메모리</div><div class="value ${levelClass(memPct)}">${fmtPct(memPct)}</div></div>
      <div class="metric"><div class="label">디스크</div><div class="value ${levelClass(diskPct)}">${fmtPct(diskPct)}</div></div>
      <div class="metric"><div class="label">가동 시간</div><div class="value">${fmtUptime(n.uptime)}</div></div>`;
  }).join('') + `</div>`;
}

function pveGuestsHtml(nodes, serverId) {
  let html = '';
  nodes.forEach((n) => {
    (n.guests || []).forEach((g) => {
      const guestMemPct = g.maxmem ? g.mem / g.maxmem : 0;
      const usage = g.status === 'running'
        ? `<span class="usage-badge">CPU ${fmtPct(g.cpu || 0)}</span><span class="usage-badge">MEM ${fmtBytes(g.mem)}</span>`
        : '';
      const ctx = `data-server="${serverId}" data-node="${esc(n.node)}" data-type="${g.type}" data-vmid="${g.id}"`;
      const actions = g.status === 'running'
        ? `<button class="icon-btn" data-guest-action="reboot" ${ctx} title="재시작">⟳</button>
           <button class="icon-btn" data-guest-action="shutdown" ${ctx} title="종료">■</button>`
        : `<button class="icon-btn" data-guest-action="start" ${ctx} title="시작">▶</button>`;
      html += `
        <div class="row" data-toggle>
          <div class="row-left">
            <span class="badge ${g.type}">${g.type === 'qemu' ? 'VM' : 'LXC'}</span>
            <span class="name">${esc(g.name || ('#' + g.id))}</span>
          </div>
          <div class="row-right">${usage}${pillFor(g.status)}<span class="guest-actions">${actions}</span></div>
          <div class="detail">
            ID <code>${g.id}</code> · 노드 ${esc(n.node)} · CPU ${fmtPct(g.cpu || 0)} · 메모리 ${fmtBytes(g.mem)} / ${fmtBytes(g.maxmem)} (${fmtPct(guestMemPct)})
          </div>
        </div>`;
    });
  });
  return `<div class="list">${html || `<div class="empty">VM / 컨테이너가 없습니다.</div>`}</div>`;
}

function connectionsHtml(items, serverId) {
  if (items.length === 0) {
    return `<div class="subhead">최근 접속 시도 <span class="hint">(방화벽 로깅이 꺼져 있으면 비어 있습니다)</span></div>
      <div class="list"><div class="empty">기록된 접속 시도가 없습니다.</div></div>`;
  }
  return `<div class="subhead">최근 접속 시도</div>
    <div class="list">${items.map(it => `
      <div class="conn-row">
        <div class="conn-left">
          <span class="action-badge ${it.action}">${it.action}</span>
          <span class="ip">${esc(it.ip)}</span>
          ${it.port ? `<span class="who">:${esc(it.port)}</span>` : ''}
        </div>
        <button class="btn-block" data-block-ip="${esc(it.ip)}" data-target="pve" data-server="${serverId}">차단</button>
      </div>`).join('')}</div>`;
}

function blocklistHtml(items, serverId, target) {
  const rows = items.length
    ? items.map(it => `
      <div class="blocked-item">
        <span>${esc(it.cidr || it.ip)}</span>
        <button class="btn-unblock" data-unblock-ip="${esc(it.cidr || it.ip)}" data-target="${target}" data-server="${serverId}">해제</button>
      </div>`).join('')
    : `<div class="empty" style="padding:6px 10px;">차단된 IP가 없습니다.</div>`;
  return `<div class="subhead">차단 목록</div>
    <div class="block-input-row">
      <input type="text" data-block-input="${target}" data-server="${serverId}" placeholder="${target === 'pve' ? 'IP 또는 CIDR' : 'IP'} (예: 1.2.3.4)">
      <button data-block-submit="${target}" data-server="${serverId}">차단</button>
    </div>
    <div class="blocked-list">${rows}</div>`;
}

async function loadPveZone(server) {
  const card = document.querySelector(`[data-pve-id="${server.id}"]`);
  const vmCard = document.querySelector(`[data-vm-id="${server.id}"]`);
  if (!card) return;
  const dot = card.querySelector('[data-role="dot"]');
  const body = card.querySelector('[data-role="body"]');
  const vmBody = vmCard ? vmCard.querySelector('[data-role="vmbody"]') : null;

  const main = await api(`/api/proxmox/${server.id}`);
  if (!main.ok) {
    dot.className = 'dot bad';
    body.innerHTML = `<div class="error-box">연결 실패: ${esc(main.error)}</div>`;
    if (vmBody) vmBody.innerHTML = `<div class="error-box">연결 실패: ${esc(main.error)}</div>`;
    return;
  }
  dot.className = 'dot ok';
  if (vmBody) vmBody.innerHTML = pveGuestsHtml(main.nodes, server.id);

  const [conn, block] = await Promise.all([
    api(`/api/proxmox/${server.id}/connections`),
    api(`/api/proxmox/${server.id}/blocklist`),
  ]);

  body.innerHTML =
    pveMetricsHtml(main.nodes) +
    connectionsHtml(conn.items || [], server.id) +
    blocklistHtml(block.items || [], server.id, 'pve');
}

/* ---------------- Synology 카드 ---------------- */

function synCardShell(server) {
  return `
    <section class="zone" data-syn-id="${server.id}">
      <div class="zone-head">
        <div class="name">
          <span class="drag-handle" draggable="true" data-syn-drag="${server.id}" title="드래그해서 순서 바꾸기">⠿</span>
          <span class="dot off" data-role="dot"></span>${esc(server.name)}
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <a class="open-link" href="${esc(server.host)}" target="_blank" rel="noopener">웹 UI 열기 ↗</a>
          <button class="icon-btn" data-edit-server="syn:${server.id}" title="서버 설정">⚙</button>
        </div>
      </div>
      <div data-role="body"><div class="empty">불러오는 중…</div></div>
    </section>`;
}

function synStorageHtml(storage) {
  const volumes = (storage && storage.volumes) || [];
  if (volumes.length === 0) return `<div class="subhead">스토리지</div><div class="empty">볼륨 정보를 가져오지 못했습니다.</div>`;
  return `<div class="subhead">스토리지</div><div class="storage-list">` + volumes.map((v) => {
    const total = parseInt(v.size?.total || 0, 10);
    const used = parseInt(v.size?.used || 0, 10);
    const pct = total ? used / total : 0;
    return `
      <div class="vol">
        <div class="vol-top"><span>${esc(v.display_name || v.id)}</span><span>${fmtBytes(used)} / ${fmtBytes(total)}</span></div>
        <div class="bar"><div class="bar-fill" style="width:${(pct*100).toFixed(0)}%; background:${pct>0.85?'var(--bad)':pct>0.65?'var(--warn)':'var(--synology)'}"></div></div>
      </div>`;
  }).join('') + `</div>`;
}

function synDockerHtml(items) {
  if (items.length === 0) return `<div class="subhead">Docker 컨테이너</div><div class="list"><div class="empty">컨테이너가 없습니다.</div></div>`;
  return `<div class="subhead">Docker 컨테이너</div><div class="list">` + items.map(c => `
    <div class="row" data-toggle>
      <div class="row-left"><span class="name">${esc(c.name || c.id)}</span></div>
      <div class="row-right">${dockerPillFor(c.status)}</div>
      <div class="detail">이미지 <code>${esc(c.image || '-')}</code></div>
    </div>`).join('') + `</div>`;
}

function synSessionsHtml(items) {
  if (items.length === 0) return `<div class="subhead">로그인 세션</div><div class="list"><div class="empty">현재 로그인된 세션이 없습니다.</div></div>`;
  return `<div class="subhead">로그인 세션</div><div class="list">` + items.map(it => `
    <div class="conn-row">
      <div class="conn-left">
        <span class="who">${esc(it.name || it.account || '-')}</span>
        <span class="ip">${esc(it.ip || '-')}</span>
      </div>
    </div>`).join('') + `</div>`;
}

async function loadSynZone(server) {
  const card = document.querySelector(`[data-syn-id="${server.id}"]`);
  if (!card) return;
  const dot = card.querySelector('[data-role="dot"]');
  const body = card.querySelector('[data-role="body"]');

  const main = await api(`/api/synology/${server.id}`);
  if (!main.ok) {
    dot.className = 'dot bad';
    body.innerHTML = `<div class="error-box">연결 실패: ${esc(main.error)}</div>`;
    return;
  }
  dot.className = 'dot ok';

  const [docker, sessions, block] = await Promise.all([
    api(`/api/synology/${server.id}/docker`),
    api(`/api/synology/${server.id}/sessions`),
    api(`/api/synology/${server.id}/blocklist`),
  ]);

  const u = main.utilization || {};
  const cpuPct = u.cpu ? (u.cpu.user_load + u.cpu.system_load) / 100 : 0;
  const memPct = u.memory ? u.memory.real_usage / 100 : 0;
  const info = main.info || {};

  body.innerHTML =
    `<div class="metrics">
      <div class="metric"><div class="label">CPU</div><div class="value ${levelClass(cpuPct)}">${fmtPct(cpuPct)}</div></div>
      <div class="metric"><div class="label">메모리</div><div class="value ${levelClass(memPct)}">${fmtPct(memPct)}</div></div>
      <div class="metric"><div class="label">모델</div><div class="value" style="font-size:14px">${esc(info.model || '-')}</div></div>
      <div class="metric"><div class="label">가동 시간</div><div class="value" style="font-size:14px">${fmtSynUptime(info.up_time)}</div></div>
    </div>` +
    synStorageHtml(main.storage) +
    synDockerHtml(docker.items || []) +
    synSessionsHtml(sessions.items || []) +
    blocklistHtml(block.items || [], server.id, 'syn');
}

let sfType = 'pve';
let sfEditingId = null;

function openServerForm(type, server) {
  sfType = type;
  sfEditingId = server ? server.id : null;
  const typeName = type === 'pve' ? 'Proxmox' : 'Synology';
  document.getElementById('serverFormTitle').textContent = server ? `${typeName} 서버 수정` : `${typeName} 서버 추가`;
  document.getElementById('sfName').value = server?.name || '';
  document.getElementById('sfHost').value = server?.host || '';
  document.getElementById('sfPveFields').style.display = type === 'pve' ? 'block' : 'none';
  document.getElementById('sfSynFields').style.display = type === 'syn' ? 'block' : 'none';

  if (type === 'pve') {
    document.getElementById('sfTokenId').value = server?.tokenId || '';
    document.getElementById('sfTokenSecret').value = '';
    document.getElementById('sfTokenSecret').placeholder = server?.hasTokenSecret ? '•••••• (저장됨, 변경하려면 입력)' : '토큰 secret 입력';
  } else {
    document.getElementById('sfUser').value = server?.user || '';
    document.getElementById('sfPassword').value = '';
    document.getElementById('sfPassword').placeholder = server?.hasPassword ? '•••••• (저장됨, 변경하려면 입력)' : '비밀번호 입력';
  }

}

document.getElementById('serverSaveBtn').addEventListener('click', async () => {
  const msg = document.getElementById('serverFormMsg');
  const name = document.getElementById('sfName').value.trim();
  const host = document.getElementById('sfHost').value.trim();
  if (!name || !host) { msg.textContent = '이름과 호스트 주소를 입력하세요.'; msg.className = 'modal-msg error'; return; }

  let payload = { name, host };
  if (sfType === 'pve') {
    payload.tokenId = document.getElementById('sfTokenId').value.trim();
    payload.tokenSecret = document.getElementById('sfTokenSecret').value.trim();
  } else {
    payload.user = document.getElementById('sfUser').value.trim();
    payload.password = document.getElementById('sfPassword').value.trim();
  }

  const base = sfType === 'pve' ? '/api/proxmox/servers' : '/api/synology/servers';
  const r = sfEditingId
    ? await api(`${base}/${sfEditingId}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    : await api(base, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });

  if (r.ok) {
    document.getElementById('serverFormOverlay').classList.remove('open');
    await loadServers();
  } else {
    msg.textContent = r.error || '저장 실패'; msg.className = 'modal-msg error';
  }
});

document.getElementById('serverDeleteBtn').addEventListener('click', async () => {
  if (!sfEditingId) return;
  if (!confirm('이 서버를 삭제할까요?')) return;
  const base = sfType === 'pve' ? '/api/proxmox/servers' : '/api/synology/servers';
  await api(`${base}/${sfEditingId}`, { method: 'DELETE' });
  document.getElementById('serverFormOverlay').classList.remove('open');
  await loadServers();
});

let refreshIntervalSec = 15;
let eventSource = null;

// 서버가 준비되는 즉시 밀어주는 실시간 업데이트 (Server-Sent Events).
// 연결이 끊기면 브라우저가 자동으로 재연결을 시도합니다.
function connectRealtime() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/stream');
  eventSource.addEventListener('refresh', () => { refresh(); });
  eventSource.onopen = () => { document.getElementById('liveDot').classList.add('on'); };
  eventSource.onerror = () => { document.getElementById('liveDot').classList.remove('on'); };
}

async function refresh() {

    await loadServers();

    document.getElementById('updated').textContent = '불러오기 실패';

document.addEventListener('click', async (e) => {
  // VM/LXC 시작/종료/재시작
  const guestActionBtn = e.target.closest('[data-guest-action]');
  if (guestActionBtn) {
    const action = guestActionBtn.dataset.guestAction;
    const { server, node, type, vmid } = guestActionBtn.dataset;
    const label = { start: '시작', shutdown: '종료', reboot: '재시작' }[action] || action;
    if (action !== 'start' && !confirm(`정말 ${label}하시겠습니까?`)) return;
    guestActionBtn.disabled = true;
    const r = await api(`/api/proxmox/${server}/guest/${node}/${type}/${vmid}/${action}`, { method: 'POST' });
    guestActionBtn.disabled = false;
    if (!r.ok) alert(`${label} 실패: ` + (r.error || '알 수 없는 오류'));
    return;
  }

  // 서버 설정 버튼 (카드의 ⚙, 서버 관리 목록 항목)
  const editServerBtn = e.target.closest('[data-edit-server]');
  if (editServerBtn) {
    const [type, id] = editServerBtn.dataset.editServer.split(':');
    const server = (type === 'pve' ? pveServers : synServers).find(s => s.id === id);
    openServerForm(type, server);
    return;
  }

  if (e.target.closest('[data-open-settings]')) { openSettings(); return; }

  const editUserBtn = e.target.closest('[data-edit-user]');
  if (editUserBtn) {
    const user = usersCache.find(u => u.id === editUserBtn.dataset.editUser);
    if (user) openUserForm(user);
    return;
  }

  // 접속 시도 목록 -> 차단
  const blockBtn = e.target.closest('[data-block-ip]');
  if (blockBtn) {
    const ip = blockBtn.dataset.blockIp, target = blockBtn.dataset.target, serverId = blockBtn.dataset.server;
    if (!ip || ip === '-') return;
    blockBtn.textContent = '차단 중…'; blockBtn.disabled = true;
    const url = target === 'pve' ? `/api/proxmox/${serverId}/block` : `/api/synology/${serverId}/block`;
    await api(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ ip }) });
    const server = (target === 'pve' ? pveServers : synServers).find(s => s.id === serverId);
    if (server) target === 'pve' ? loadPveZone(server) : loadSynZone(server);
    return;
  }

  // 차단 목록 -> 해제
  const unblockBtn = e.target.closest('[data-unblock-ip]');
  if (unblockBtn) {
    const ip = unblockBtn.dataset.unblockIp, target = unblockBtn.dataset.target, serverId = unblockBtn.dataset.server;
    unblockBtn.textContent = '해제 중…'; unblockBtn.disabled = true;
    const url = target === 'pve' ? `/api/proxmox/${serverId}/block/${encodeURIComponent(ip)}` : `/api/synology/${serverId}/block/${encodeURIComponent(ip)}`;
    await api(url, { method: 'DELETE' });
    const server = (target === 'pve' ? pveServers : synServers).find(s => s.id === serverId);
    if (server) target === 'pve' ? loadPveZone(server) : loadSynZone(server);
    return;
  }

  // 직접 IP 입력 -> 차단
  const submitBtn = e.target.closest('[data-block-submit]');
  if (submitBtn) {
    const target = submitBtn.dataset.blockSubmit, serverId = submitBtn.dataset.server;
    const input = submitBtn.closest('.block-input-row').querySelector('[data-block-input]');
    const ip = input.value.trim();
    if (!ip) return;
    const url = target === 'pve' ? `/api/proxmox/${serverId}/block` : `/api/synology/${serverId}/block`;
    await api(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ ip }) });
    input.value = '';
    const server = (target === 'pve' ? pveServers : synServers).find(s => s.id === serverId);
    if (server) target === 'pve' ? loadPveZone(server) : loadSynZone(server);
    return;
  }

  // VM/컨테이너 행 펼치기/접기
  const row = e.target.closest('.row[data-toggle]');
  if (row) { row.classList.toggle('expanded'); return; }

  // 모달 닫기 (공용 X 버튼, 오버레이 배경 클릭은 별도 리스너)
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn) { document.getElementById(closeBtn.dataset.close).classList.remove('open'); return; }
});

document.getElementById('settingsOverlay').addEventListener('click', (e) => { if (e.target.id === 'settingsOverlay') e.currentTarget.classList.remove('open'); });
document.getElementById('serverFormOverlay').addEventListener('click', (e) => { if (e.target.id === 'serverFormOverlay') e.currentTarget.classList.remove('open'); });

/* ---------------- 서비스 바로가기 (그룹/타일) ---------------- */

const PALETTE = ['#e8823c','#4f8ff0','#5cc98a','#e0b84c','#a978e0','#e5636b','#3fc0c7','#c77dd6'];
function colorFor(name) {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

let tileStatusCache = {};
let editingGroupId = null; // 그룹 모달에서 수정 중인 그룹 id (null이면 새로 만들기)
let editingTileId = null;  // 타일 모달에서 수정 중인 타일 id (null이면 새로 만들기)
let editingTileGroupId = null;

function tileEl(tile) {
  const st = tileStatusCache[tile.id] || {};
  const statusClass = tile.statusCheck === false ? '' : (st.status || 'unknown');
  const iconHtml = tile.icon
    ? `<img src="${esc(tile.icon)}" alt="">`
    : esc((tile.name || '?').trim().charAt(0).toUpperCase());
  const stats = st.stats || [];
  const statsHtml = stats.length ? `
    <div class="tile-stats">
      ${stats.slice(0,4).map(s => `<div class="tile-stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div></div>`).join('')}
    </div>` : '';
  return `
    <div class="tile" data-tile-id="${tile.id}">
      <span class="tile-drag-handle" draggable="true" data-tile-drag="${tile.id}" data-tile-group="${tile.groupId}" title="드래그해서 순서 바꾸기">⠿</span>
      <button class="tile-edit-btn" data-edit-tile="${tile.id}" data-group="${tile.groupId}">✎</button>
      <a href="${esc(tile.url || '#')}" target="_blank" rel="noopener" class="tile-top" style="text-decoration:none">
        <div class="tile-icon" style="background:${tile.icon ? 'transparent' : colorFor(tile.name)}">${iconHtml}</div>
        <div class="tile-text">
          <span style="display:flex;align-items:center;gap:6px;">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(tile.name)}</span>
          </span>
          <div class="sub">${esc(tile.subtitle || '')}</div>
        </div>
        ${tile.statusCheck === false ? '' : `<span class="tile-status ${statusClass}"></span>`}
      </a>
      ${statsHtml}
    </div>`;
}

function renderGroups(groups) {
  const box = document.getElementById('groupsContainer');
  if (groups.length === 0) {
    box.innerHTML = `<div class="empty" style="padding:20px 0;">아직 추가된 바로가기가 없습니다. 위 "+ 그룹 추가" 버튼으로 시작하세요.</div>`;
    return;
  }
  box.innerHTML = groups.map(g => `
    <div class="group-card" data-group-id="${g.id}">
      <div class="group-head">
        <span class="drag-handle" draggable="true" data-group-drag="${g.id}" title="드래그해서 순서 바꾸기">⠿</span>
        <h3>${esc(g.name)}</h3>
        <div class="group-actions">
          <button class="icon-btn" data-edit-group="${g.id}" title="그룹 수정">✎</button>
        </div>
      </div>
      <div class="tile-grid">
        ${(g.tiles || []).map(t => tileEl({ ...t, groupId: g.id })).join('')}
        <button class="add-tile-card" data-add-tile="${g.id}">+ 바로가기 추가</button>
      </div>
    </div>`).join('');
  initAllResizables();
}

let groupsCache = [];

async function loadGroups() {
  const data = await api('/api/groups');
  groupsCache = data.groups || [];
  renderGroups(groupsCache);
  loadTileStatus();
}

async function loadTileStatus() {
  const data = await api('/api/tiles/status');
  tileStatusCache = data.items || {};
  renderGroups(groupsCache);
}

/* --- 그룹 모달 --- */
function openGroupModal(group) {
  editingGroupId = group ? group.id : null;
  document.getElementById('groupModalTitle').textContent = group ? '그룹 수정' : '그룹 추가';
  document.getElementById('groupNameInput').value = group ? group.name : '';
  document.getElementById('groupDeleteBtn').style.display = group ? 'inline-block' : 'none';
  document.getElementById('groupModalMsg').textContent = '';
  document.getElementById('groupModalOverlay').classList.add('open');
}

document.getElementById('addGroupBtn').addEventListener('click', () => openGroupModal(null));

document.getElementById('groupSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('groupNameInput').value.trim();
  const msg = document.getElementById('groupModalMsg');
  if (!name) { msg.textContent = '이름을 입력하세요.'; msg.className = 'modal-msg error'; return; }
  const r = editingGroupId
    ? await api(`/api/groups/${editingGroupId}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) })
    : await api('/api/groups', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
  if (r.ok) {
    document.getElementById('groupModalOverlay').classList.remove('open');
    await loadGroups();
  } else {
    msg.textContent = r.error || '저장 실패'; msg.className = 'modal-msg error';
  }
});

document.getElementById('groupDeleteBtn').addEventListener('click', async () => {
  if (!editingGroupId) return;
  if (!confirm('이 그룹과 안의 바로가기를 모두 삭제할까요?')) return;
  await api(`/api/groups/${editingGroupId}`, { method: 'DELETE' });
  document.getElementById('groupModalOverlay').classList.remove('open');
  await loadGroups();
});

/* --- 타일 모달 --- */
let cjFields = [];

function renderCjFields() {
  const box = document.getElementById('cjFieldsList');
  box.innerHTML = cjFields.map((f, i) => `
    <div class="custom-field-row">
      <input type="text" placeholder="라벨 (예: USERS)" value="${esc(f.label)}" data-cj-label="${i}">
      <input type="text" placeholder="경로 (예: stats.users)" value="${esc(f.path)}" data-cj-path="${i}">
      <button class="icon-btn" data-cj-remove="${i}">✕</button>
    </div>`).join('');
}

document.getElementById('cjAddFieldBtn').addEventListener('click', () => {
  if (cjFields.length >= 4) return;
  cjFields.push({ label: '', path: '' });
  renderCjFields();
});

document.getElementById('cjFieldsList').addEventListener('input', (e) => {
  const li = e.target.dataset.cjLabel, pi = e.target.dataset.cjPath;
  if (li !== undefined) cjFields[li].label = e.target.value;
  if (pi !== undefined) cjFields[pi].path = e.target.value;
});
document.getElementById('cjFieldsList').addEventListener('click', (e) => {
  const ri = e.target.dataset.cjRemove;
  if (ri !== undefined) { cjFields.splice(ri, 1); renderCjFields(); }
});

function toggleWidgetFields() {
  const w = document.getElementById('tileWidget').value;
  document.getElementById('portainerFields').style.display = w === 'portainer' ? 'block' : 'none';
  document.getElementById('customJsonFields').style.display = w === 'custom_json' ? 'block' : 'none';
}
document.getElementById('tileWidget').addEventListener('change', toggleWidgetFields);

function openTileModal(groupId, tile) {
  editingTileGroupId = groupId;
  editingTileId = tile ? tile.id : null;
  document.getElementById('tileModalTitle').textContent = tile ? '바로가기 수정' : '바로가기 추가';
  document.getElementById('tileName').value = tile?.name || '';
  document.getElementById('tileSubtitle').value = tile?.subtitle || '';
  document.getElementById('tileUrl').value = tile?.url || '';
  document.getElementById('tileIcon').value = tile?.icon || '';
  document.getElementById('tileStatusCheck').checked = tile?.statusCheck !== false;
  document.getElementById('tileWidget').value = tile?.widget || 'none';
  document.getElementById('pfHost').value = tile?.portainer?.host || '';
  document.getElementById('pfApiKey').value = '';
  document.getElementById('pfApiKey').placeholder = tile?.portainer?.hasApiKey ? '•••••• (저장됨, 변경하려면 입력)' : 'API Key 입력';
  document.getElementById('cjEndpoint').value = tile?.customJson?.endpoint || '';
  document.getElementById('cjHeaderName').value = tile?.customJson?.headerName || '';
  document.getElementById('cjHeaderValue').value = '';
  document.getElementById('cjHeaderValue').placeholder = tile?.customJson?.hasHeaderValue ? '•••••• (저장됨)' : '헤더 값 (선택)';
  cjFields = tile?.customJson?.fields ? [...tile.customJson.fields] : [];
  renderCjFields();
  toggleWidgetFields();
  document.getElementById('tileDeleteBtn').style.display = tile ? 'inline-block' : 'none';
  document.getElementById('tileModalMsg').textContent = '';
  document.getElementById('tileModalOverlay').classList.add('open');
}

document.getElementById('tileSaveBtn').addEventListener('click', async () => {
  const msg = document.getElementById('tileModalMsg');
  const name = document.getElementById('tileName').value.trim();
  if (!name) { msg.textContent = '이름을 입력하세요.'; msg.className = 'modal-msg error'; return; }
  const widget = document.getElementById('tileWidget').value;
  const payload = {
    name,
    subtitle: document.getElementById('tileSubtitle').value.trim(),
    url: document.getElementById('tileUrl').value.trim(),
    icon: document.getElementById('tileIcon').value.trim(),
    statusCheck: document.getElementById('tileStatusCheck').checked,
    widget,
  };
  if (widget === 'portainer') {
    payload.portainer = { host: document.getElementById('pfHost').value.trim(), apiKey: document.getElementById('pfApiKey').value.trim() };
  }
  if (widget === 'custom_json') {
    payload.customJson = {
      endpoint: document.getElementById('cjEndpoint').value.trim(),
      headerName: document.getElementById('cjHeaderName').value.trim(),
      headerValue: document.getElementById('cjHeaderValue').value.trim(),
      fields: cjFields.filter(f => f.label && f.path),
    };
  }
  const r = editingTileId
    ? await api(`/api/tiles/${editingTileId}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    : await api(`/api/groups/${editingTileGroupId}/tiles`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (r.ok) {
    document.getElementById('tileModalOverlay').classList.remove('open');
    await loadGroups();
  } else {
    msg.textContent = r.error || '저장 실패'; msg.className = 'modal-msg error';
  }
});

document.getElementById('tileDeleteBtn').addEventListener('click', async () => {
  if (!editingTileId) return;
  if (!confirm('이 바로가기를 삭제할까요?')) return;
  await api(`/api/tiles/${editingTileId}`, { method: 'DELETE' });
  document.getElementById('tileModalOverlay').classList.remove('open');
  await loadGroups();
});

// 그룹/타일 관련 클릭 위임 (수정 버튼, 추가 버튼, 모달 닫기)
document.addEventListener('click', (e) => {
  const editGroupBtn = e.target.closest('[data-edit-group]');
  if (editGroupBtn) { openGroupModal(groupsCache.find(g => g.id === editGroupBtn.dataset.editGroup)); return; }

  const addTileBtn = e.target.closest('[data-add-tile]');
  if (addTileBtn) { openTileModal(addTileBtn.dataset.addTile, null); return; }

  const editTileBtn = e.target.closest('[data-edit-tile]');
  if (editTileBtn) {
    e.preventDefault();
    const g = groupsCache.find(g => g.id === editTileBtn.dataset.group);
    const t = g?.tiles.find(t => t.id === editTileBtn.dataset.editTile);
    if (t) openTileModal(g.id, t);
    return;
  }

  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn) { document.getElementById(closeBtn.dataset.close).classList.remove('open'); return; }
});
document.getElementById('groupModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'groupModalOverlay') e.currentTarget.classList.remove('open'); });
document.getElementById('tileModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'tileModalOverlay') e.currentTarget.classList.remove('open'); });

/* ---------------- 그룹/타일/서버 카드 드래그앤드롭 순서 변경 ---------------- */

document.addEventListener('dragstart', (e) => {
  const gh = e.target.closest('[data-group-drag]');
  if (gh) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'group:' + gh.dataset.groupDrag); return; }
  const th = e.target.closest('[data-tile-drag]');
  if (th) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'tile:' + th.dataset.tileDrag + ':' + th.dataset.tileGroup); return; }
  const ph = e.target.closest('[data-pve-drag]');
  if (ph) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'pve:' + ph.dataset.pveDrag); return; }
  const sh = e.target.closest('[data-syn-drag]');
  if (sh) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'syn:' + sh.dataset.synDrag); return; }
});

document.addEventListener('dragover', (e) => {
  if (e.target.closest('[data-group-id]') || e.target.closest('.tile-grid') ||
      e.target.closest('[data-pve-id]') || e.target.closest('[data-syn-id]') || e.target.closest('[data-vm-id]')) {
    e.preventDefault();
  }
});

document.addEventListener('drop', async (e) => {
  const data = e.dataTransfer.getData('text/plain');
  if (!data) return;

  if (data.startsWith('group:')) {
    e.preventDefault();
    const draggedId = data.slice('group:'.length);
    const targetCard = e.target.closest('[data-group-id]');
    if (!targetCard || targetCard.dataset.groupId === draggedId) return;
    const from = groupsCache.findIndex(g => g.id === draggedId);
    const to = groupsCache.findIndex(g => g.id === targetCard.dataset.groupId);
    if (from === -1 || to === -1) return;
    const [moved] = groupsCache.splice(from, 1);
    groupsCache.splice(to, 0, moved);
    renderGroups(groupsCache);
    await api('/api/groups/reorder', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ order: groupsCache.map(g => g.id) }) });
    return;
  }

  if (data.startsWith('tile:')) {
    e.preventDefault();
    const [, draggedId, fromGroupId] = data.split(':');
    const targetGroupCard = e.target.closest('[data-group-id]');
    if (!targetGroupCard) return;
    const toGroupId = targetGroupCard.dataset.groupId;
    const targetTileEl = e.target.closest('[data-tile-id]');
    const targetTileId = targetTileEl && targetTileEl.dataset.tileId !== draggedId ? targetTileEl.dataset.tileId : null;

    const fromGroup = groupsCache.find(g => g.id === fromGroupId);
    const toGroup = groupsCache.find(g => g.id === toGroupId);
    if (!fromGroup || !toGroup) return;

    if (fromGroupId === toGroupId) {
      // 같은 그룹 안에서 순서만 변경
      if (!targetTileId) return;
      const from = fromGroup.tiles.findIndex(t => t.id === draggedId);
      const to = fromGroup.tiles.findIndex(t => t.id === targetTileId);
      if (from === -1 || to === -1) return;
      const [moved] = fromGroup.tiles.splice(from, 1);
      fromGroup.tiles.splice(to, 0, moved);
      renderGroups(groupsCache);
      await api(`/api/groups/${fromGroup.id}/tiles/reorder`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ order: fromGroup.tiles.map(t => t.id) }) });
      return;
    }

    // 다른 그룹으로 이동
    const tileIdx = fromGroup.tiles.findIndex(t => t.id === draggedId);
    if (tileIdx === -1) return;
    const [moved] = fromGroup.tiles.splice(tileIdx, 1);
    toGroup.tiles = toGroup.tiles || [];
    if (targetTileId) {
      const insertAt = toGroup.tiles.findIndex(t => t.id === targetTileId);
      toGroup.tiles.splice(insertAt === -1 ? toGroup.tiles.length : insertAt, 0, moved);
    } else {
      toGroup.tiles.push(moved);
    }
    renderGroups(groupsCache);
    await api(`/api/tiles/${draggedId}/move`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ toGroupId: toGroup.id, order: toGroup.tiles.map(t => t.id) }),
    });
    return;
  }

  if (data.startsWith('pve:')) {
    e.preventDefault();
    const draggedId = data.slice('pve:'.length);
    const targetCard = e.target.closest('[data-pve-id]') || e.target.closest('[data-vm-id]');
    if (!targetCard) return;
    const targetId = targetCard.dataset.pveId || targetCard.dataset.vmId;
    if (targetId === draggedId) return;
    const from = pveServers.findIndex(s => s.id === draggedId);
    const to = pveServers.findIndex(s => s.id === targetId);
    if (from === -1 || to === -1) return;
    const [moved] = pveServers.splice(from, 1);
    pveServers.splice(to, 0, moved);
    renderServerGrid();
    await api('/api/proxmox/servers/reorder', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ order: pveServers.map(s => s.id) }) });
    return;
  }

  if (data.startsWith('syn:')) {
    e.preventDefault();
    const draggedId = data.slice('syn:'.length);
    const targetCard = e.target.closest('[data-syn-id]');
    if (!targetCard || targetCard.dataset.synId === draggedId) return;
    const from = synServers.findIndex(s => s.id === draggedId);
    const to = synServers.findIndex(s => s.id === targetCard.dataset.synId);
    if (from === -1 || to === -1) return;
    const [moved] = synServers.splice(from, 1);
    synServers.splice(to, 0, moved);
    renderServerGrid();
    await api('/api/synology/servers/reorder', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ order: synServers.map(s => s.id) }) });
  }
});

loadGroups();
setInterval(loadTileStatus, 20000);

document.getElementById('refreshBtn').addEventListener('click', refresh);

checkAuthStatus();
api('/api/version').then(d => { document.getElementById('versionBadge').textContent = d.version ? `· v${d.version}` : ''; });
loadGeneralSettings().then(() => { refresh(); connectRealtime(); });
</script>
